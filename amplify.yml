version: 1
backend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        - echo "NODE_ENV=production" >> .env
        - echo "SESSION_SECRET=$SESSION_SECRET" >> .env
        - echo "PORT=3000" >> .env
    build:
      commands:
        - npm run build
        - npm run db:push
    postBuild:
      commands:
        - echo "Backend build completed"
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
frontend:
  phases:
    preBuild:
      commands:
        - echo "Frontend build starting..."
    build:
      commands:
        - echo "Frontend assets are included in backend build"
  artifacts:
    baseDirectory: dist/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*