# Docker Compose for local development and testing
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ddc_management
      POSTGRES_USER: ddcadmin
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddcadmin -d ddc_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DDC Management Application
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ddcadmin:localdev123@postgres:5432/ddc_management
      - SESSION_SECRET=local-development-secret-key
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./attached_assets:/app/attached_assets
    restart: unless-stopped

volumes:
  postgres_data: